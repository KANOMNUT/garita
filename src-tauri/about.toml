# cargo-about config for THIRD_PARTY_LICENSES. The regenerate command is in
# scripts/third-party-licenses.mjs.
# accepted: the preference order when a crate offers a choice (MIT first). Keep it
#   in step with [licenses].allow in deny.toml.
# targets: the same as [graph].targets in deny.toml, a superset of what the
#   release workflow ships.
accepted = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "ISC", "BSD-2-Clause", "BSD-3-Clause", "Zlib", "Unicode-3.0", "MPL-2.0", "BSL-1.0", "0BSD", "CC0-1.0", "MIT-0", "Unlicense"]
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
workarounds = ["ring", "rustls", "chrono", "bitvec", "wasmtime", "cocoa", "gtk", "prost", "tonic", "sentry"]

[private]
ignore = true
