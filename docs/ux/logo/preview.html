<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Garita logo</title>
<style>
:root{color-scheme:light dark;--bg:#f1f3f8;--ink:#0f172a}
@media(prefers-color-scheme:dark){:root{--bg:#0b0d12;--ink:#e6e9ef}}
body{margin:0;padding:1rem;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,sans-serif;max-width:60rem;margin-inline:auto}
h1{font-size:1.4rem}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));gap:1rem}
.tile{display:flex;align-items:flex-end;gap:1rem;padding:1rem;border-radius:12px;flex-wrap:wrap;border:1px solid rgba(128,128,128,.3)}
.dark{background:#0b0d12}.light{background:#f8f9fc}
.mk{width:40px;height:46px;background:#e6e9ef;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}.light .mk{background:#0f172a}
</style></head><body>
<h1>Garita: final mark</h1>
<p>App icon at 256, 64, 32 and 16 px, then the body-less mark (currentColor) at 46 and 18 px, on a dark and a light tile.</p>
<div class="pair"><div class="tile dark"><img src="garita-final.svg" width=256 height=256 alt=""><img src="garita-final.svg" width=64 height=64 alt=""><img src="garita-final.svg" width=32 height=32 alt=""><img src="garita-final.svg" width=16 height=16 alt=""><span class=mk role=img aria-label="mark" style="-webkit-mask-image:url(garita-final-mark.svg);mask-image:url(garita-final-mark.svg)"></span><span class=mk style="width:16px;height:18px;-webkit-mask-image:url(garita-final-mark.svg);mask-image:url(garita-final-mark.svg)"></span></div><div class="tile light"><img src="garita-final.svg" width=256 height=256 alt=""><img src="garita-final.svg" width=64 height=64 alt=""><img src="garita-final.svg" width=32 height=32 alt=""><img src="garita-final.svg" width=16 height=16 alt=""><span class=mk role=img aria-label="mark" style="-webkit-mask-image:url(garita-final-mark.svg);mask-image:url(garita-final-mark.svg)"></span><span class=mk style="width:16px;height:18px;-webkit-mask-image:url(garita-final-mark.svg);mask-image:url(garita-final-mark.svg)"></span></div></div>
</body></html>
