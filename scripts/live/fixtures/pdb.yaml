apiVersion: apps/v1
kind: Deployment
metadata: { name: web }
spec:
  replicas: 2
  selector: { matchLabels: { app: web } }
  template:
    metadata: { labels: { app: web } }
    spec:
      containers:
        - name: c
          image: busybox:1.36
          command: ["sleep", "3600"]
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: web }
spec:
  minAvailable: 2
  selector: { matchLabels: { app: web } }
---
apiVersion: batch/v1
kind: Job
metadata: { name: done }
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - { name: c, image: "busybox:1.36", command: ["sh", "-c", "echo done"] }
