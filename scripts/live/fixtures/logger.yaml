apiVersion: v1
kind: Pod
metadata: { name: logger, labels: { app: logger } }
spec:
  containers:
    - name: c
      image: busybox:1.36
      command: ["sh", "-c", "i=0; while true; do i=$((i+1)); echo line-$i; sleep 1; done"]
---
apiVersion: v1
kind: Pod
metadata: { name: crash }
spec:
  restartPolicy: Always
  containers:
    - name: c
      image: busybox:1.36
      command: ["sh", "-c", "echo boom; exit 1"]
