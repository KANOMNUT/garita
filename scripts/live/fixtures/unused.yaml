apiVersion: v1
kind: ConfigMap
metadata: { name: orphan-cm }
data: { k: v }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: cron-cm }
data: { k: v }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: init-cm }
data: { k: v }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: proj-cm }
data: { k: v }
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: cj }
spec:
  schedule: "0 0 1 1 *"
  suspend: true
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: c
              image: busybox:1.36
              command: ["true"]
              envFrom: [{ configMapRef: { name: cron-cm } }]
---
apiVersion: v1
kind: Pod
metadata: { name: consumer }
spec:
  initContainers:
    - name: i
      image: busybox:1.36
      command: ["true"]
      envFrom: [{ configMapRef: { name: init-cm } }]
  containers:
    - name: c
      image: busybox:1.36
      command: ["sleep", "3600"]
      volumeMounts: [{ name: p, mountPath: /p }]
  volumes:
    - name: p
      projected:
        sources:
          - configMap: { name: proj-cm }
