apiVersion: v1
kind: Pod
metadata: { name: oom }
spec:
  restartPolicy: Always
  containers:
    - name: c
      image: busybox:1.36
      command: ["tail", "/dev/zero"]
      resources: { limits: { memory: 16Mi } }
---
apiVersion: v1
kind: Pod
metadata: { name: stuck }
spec:
  nodeSelector: { garita-live-no-such-label: "1" }
  containers:
    - { name: c, image: "busybox:1.36", command: ["sleep", "3600"] }
---
apiVersion: batch/v1
kind: Job
metadata: { name: failjob }
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - { name: c, image: "busybox:1.36", command: ["sh", "-c", "exit 1"] }
---
apiVersion: v1
kind: Service
metadata: { name: lonely }
spec:
  selector: { app: nobody }
  ports: [{ port: 80 }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: unbound }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 1Gi } }
---
apiVersion: v1
kind: Pod
metadata: { name: crash }
spec:
  restartPolicy: Always
  containers:
    - name: c
      image: busybox:1.36
      command: ["sh", "-c", "echo boom; exit 1"]
