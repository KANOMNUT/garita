name: Bug report
description: Something in Garita does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not paste kubeconfig files, tokens, Secret values or private cluster names.**
        For a security issue, use [private vulnerability reporting](../security/advisories/new) instead of this form.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Select context "..."
        2. Open Workloads > Deployments
        3. Click "..."
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Garita version
      description: Shown at the top of the sidebar, or in the installer file name.
      placeholder: "1.4.1"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS (Apple Silicon)
        - Windows
        - Linux (.deb)
        - Linux (.rpm)
        - Built from source
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: OS version
      placeholder: "macOS 15.1, Windows 11 24H2, Ubuntu 24.04"

  - type: dropdown
    id: cluster
    attributes:
      label: Cluster type
      options:
        - kind / minikube / k3s / other local
        - kubeadm / RKE2 / self-hosted
        - EKS
        - GKE
        - AKS
        - OpenShift
        - Rancher
        - Other
    validations:
      required: true

  - type: input
    id: k8s-version
    attributes:
      label: Kubernetes version
      description: Server version, from `kubectl version` or the Deprecated APIs page under Health.
      placeholder: "1.31.2"

  - type: textarea
    id: logs
    attributes:
      label: App log
      description: |
        Settings > Diagnostics > Open log folder. The log is scrubbed, but check it for anything private before pasting.
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I removed credentials, Secret values and private names from this report.
          required: true
