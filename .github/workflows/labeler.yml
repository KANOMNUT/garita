# Labels pull requests by the paths they change (rules: .github/labeler.yml).
#
# pull_request_target so that pull requests from forks can be labelled too.
# That trigger runs with a write token, so this job must never check out or
# run code from the pull request: it only reads the list of changed files.
name: Labeler

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] no checkout, no PR code runs
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Label
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # add and remove labels
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: true
