# OpenSSF Scorecard: grades the repository's security practices (branch
# protection, pinned dependencies, token permissions, ...). Runs on a public
# repository, or when the repository variable CODE_SCANNING is "true": results
# publish to the public Scorecard API and appear under Security > Code scanning.
#
# The Scorecard API checks this file before accepting results: keep the job
# on ubuntu, with no top-level env or defaults and only the actions below.
name: Scorecard

on:
  push:
    branches: [main]
  branch_protection_rule:
  schedule:
    - cron: "29 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    # Scheduled runs carry no repository payload: they need CODE_SCANNING.
    if: github.event.repository.visibility == 'public' || vars.CODE_SCANNING == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # Token-Permissions and CI checks read workflow runs
      security-events: write # upload results to code scanning
      id-token: write # publish results to the Scorecard API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
