# Builds the installers for a version tag and attaches them to a DRAFT GitHub
# release. A maintainer reviews the draft and publishes it by hand.
#
#   git tag -s v2.0.0 -m "Garita v2.0.0" && git push origin v2.0.0
#
# The tag must match the version in package.json, src-tauri/Cargo.toml and
# src-tauri/tauri.conf.json, and CHANGELOG.md must have a "## [X.Y.Z]" section:
# its text becomes the release notes. To rebuild an existing tag, run this
# workflow by hand with that tag.
#
# The in-app updater files are made here too: the macOS .app.tar.gz from the
# ad-hoc-signed app (build), and the minisign signatures plus latest.json in the
# publish job, the only place the updater key exists (GitHub Environment
# "release"). A rebuild by hand must be dispatched FROM the tag ref, or the
# environment rule refuses the publish job. See docs/build-and-release.md.
#
# Release jobs use no build caches, so a poisoned cache from a pull request
# cannot reach a shipped binary. macOS builds are ad-hoc signed only (see
# docs/build-and-release.md).
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v2.0.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  prepare:
    name: Prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.sha.outputs.sha }} # every later job builds this exact commit
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false

      - name: Pin the tag commit
        id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check versions and extract release notes
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ] && [ "$GITHUB_REF" != "refs/tags/$TAG" ]; then
            echo "::error::dispatch this workflow from the tag ref (Use workflow from: $TAG), not from $GITHUB_REF"
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Tag '$TAG' is not vX.Y.Z"
            exit 1
          fi
          version="${TAG#v}"
          pkg=$(node -p "require('./package.json').version")
          conf=$(node -p "require('./src-tauri/tauri.conf.json').version")
          crate=$(sed -n 's/^version = "\(.*\)"$/\1/p' src-tauri/Cargo.toml | head -n 1)
          status=0
          for pair in "package.json:$pkg" "src-tauri/tauri.conf.json:$conf" "src-tauri/Cargo.toml:$crate"; do
            if [ "${pair#*:}" != "$version" ]; then
              echo "::error file=${pair%%:*}::version ${pair#*:} does not match tag $TAG"
              status=1
            fi
          done
          [ "$status" -eq 0 ] || exit 1

          # The section between "## [X.Y.Z]" and the next "## [" heading.
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error file=CHANGELOG.md::no '## [$version]' section (or it is empty)"
            exit 1
          fi

      # Fail before the 90-minute build if the updater pubkey is unusable.
      - name: Check updater pubkey
        env:
          # Raw keynum bytes as `keyid` below computes them: byte-reversed vs the
          # ID in the .pub comment (this key: comment 25CF8B174978A88C).
          EXPECTED_KEY_ID: "8ca87849178bcf25"
        run: |
          set -euo pipefail
          keyid() { # keyid <base64 of a minisign file>
            printf '%s' "$1" | base64 -d | sed -n 2p | base64 -d | head -c 10 | tail -c 8 | od -An -tx1 | tr -d ' \n'
          }
          pub=$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey")
          if ! pub_id=$(keyid "$pub") || [ "${#pub_id}" -ne 16 ]; then
            echo "::error file=src-tauri/tauri.conf.json::plugins.updater.pubkey is not a decodable minisign public key"
            exit 1
          fi
          echo "updater pubkey key ID: $pub_id"
          if [ -n "$EXPECTED_KEY_ID" ] && [ "$pub_id" != "$EXPECTED_KEY_ID" ]; then
            echo "::error file=src-tauri/tauri.conf.json::pubkey key ID $pub_id is not the expected $EXPECTED_KEY_ID"
            exit 1
          fi

      - name: Generate SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: Garita-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
          dependency-snapshot: false

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-meta
          path: |
            release-notes.md
            Garita-sbom.spdx.json
          if-no-files-found: error
          retention-days: 7

  build:
    name: Build (${{ matrix.name }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          # Unsigned (no Authenticode); the updater .sig files are made in publish only.
          - name: Windows x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
          # The oldest supported Ubuntu runner: the .deb and .rpm
          # then run on any distribution with this glibc or newer.
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: deb,rpm # no AppImage: it bundles LGPL libs whose notices are not shipped
    env:
      TARGET: ${{ matrix.target }}
      BUNDLES: ${{ matrix.bundles }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev \
            patchelf file libfuse2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target "$TARGET" --no-self-update
          rustup default stable

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build installers
        run: npx tauri build --target "$TARGET" --bundles "$BUNDLES"

      # Same as `make mac`: ad-hoc sign the .app (never with --options
      # runtime), then make the updater tarball from that SIGNED app (never
      # by `tauri build`), then rebuild the DMG from the same app.
      - name: Ad-hoc sign macOS app and make updater tarball
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          bundle="src-tauri/target/$TARGET/release/bundle"
          app=$(find "$bundle/macos" -maxdepth 1 -name "*.app" | head -n 1)
          dmg=$(find "$bundle/dmg" -name "*.dmg" | head -n 1)
          name=$(basename "$app")
          codesign --sign - --deep --force "$app"
          codesign --verify --deep --strict "$app"

          # One top-level entry: the updater drops the first path component.
          # COPYFILE_DISABLE keeps AppleDouble (._*) entries out.
          tgz="$bundle/macos/Garita.app.tar.gz"
          COPYFILE_DISABLE=1 tar -C "$bundle/macos" -czf "$tgz" "$name"

          roots=$(tar -tzf "$tgz" | cut -d/ -f1 | sort -u)
          if [ "$roots" != "$name" ]; then
            echo "::error::updater tarball top level is '$roots', expected only '$name'"
            exit 1
          fi
          if tar -tzf "$tgz" | grep -q '/\._'; then
            echo "::error::updater tarball has AppleDouble (._*) entries"
            exit 1
          fi
          chk=$(mktemp -d)
          tar -xzf "$tgz" -C "$chk"
          codesign --verify --deep --strict "$chk/$name"
          rm -rf "$chk"

          rm -f "$dmg"
          hdiutil create -volname "Garita" -srcfolder "$app" -ov -format UDZO "$dmg"

      # Stable file names, the same ones the README download table uses.
      - name: Collect installers
        run: |
          set -euo pipefail
          bundle="src-tauri/target/$TARGET/release/bundle"
          mkdir -p out
          pick() { # pick <dir> <glob> <name>
            local f
            f=$(find "$bundle/$1" -maxdepth 1 -name "$2" | head -n 1)
            if [ -z "$f" ]; then
              echo "::error::no $2 in $bundle/$1"
              exit 1
            fi
            cp "$f" "out/$3"
          }
          case "$TARGET" in
            aarch64-apple-darwin)
              pick dmg "*.dmg" Garita-macOS-arm64.dmg
              pick macos "*.app.tar.gz" Garita-macOS-arm64.app.tar.gz ;;
            x86_64-unknown-linux-gnu)
              pick deb "*.deb" Garita-linux-amd64.deb
              pick rpm "*.rpm" Garita-linux-amd64.rpm ;;
            x86_64-pc-windows-msvc)
              pick msi "*.msi" Garita-windows-amd64.msi
              pick nsis "*-setup.exe" Garita-windows-amd64-setup.exe ;;
          esac
          ls -l out

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: installers-${{ matrix.target }}
          path: out/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Draft release
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Holds the updater signing secrets; limited to v* tags in the repo settings.
    environment: release
    permissions:
      contents: write # create the draft release and upload its files
      id-token: write # sign the provenance attestation (Sigstore OIDC)
      attestations: write # store the attestation
    steps:
      # Before the downloads: checkout cleans the workspace. Supplies the
      # lock-pinned tauri CLI and tauri.conf.json (pubkey).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-meta
          path: meta

      # The only step that sees the updater key. Never echo it, no `set -x`.
      # --app-version binds each signature to this release (requireSignedVersion).
      - name: Sign updater files
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for f in Garita-macOS-arm64.app.tar.gz Garita-linux-amd64.deb Garita-linux-amd64.rpm \
                   Garita-windows-amd64.msi Garita-windows-amd64-setup.exe; do
            npx --no-install tauri signer sign --app-version "${TAG#v}" "dist/$f" > /dev/null
            test -s "dist/$f.sig"
          done

      # Fails closed. tauri-cli only warns on a key mismatch, and a mismatch
      # would strand every installed copy.
      - name: Check signing key
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends minisign
          # minisign key ID: bytes 2..10 of the decoded 2nd line.
          keyid() { # keyid <base64 of a minisign file>
            printf '%s' "$1" | base64 -d | sed -n 2p | base64 -d | head -c 10 | tail -c 8 | od -An -tx1 | tr -d ' \n'
          }
          pub=$(node -p "require('./src-tauri/tauri.conf.json').plugins.updater.pubkey")
          if ! pub_id=$(keyid "$pub") || [ "${#pub_id}" -ne 16 ]; then
            echo "::error file=src-tauri/tauri.conf.json::plugins.updater.pubkey is not a decodable minisign public key"
            exit 1
          fi
          version="${TAG#v}"
          pubfile=$(mktemp)
          printf '%s' "$pub" | base64 -d > "$pubfile"
          for f in dist/*.sig; do
            sig=$(cat "$f")
            if ! sig_id=$(keyid "$sig") || [ "$sig_id" != "$pub_id" ]; then
              echo "::error::$f was not signed with the key in tauri.conf.json"
              exit 1
            fi
            if ! printf '%s' "$sig" | base64 -d | sed -n 3p | tr '\t' '\n' | grep -qxF "version:$version"; then
              echo "::error::$f is not bound to version $version"
              exit 1
            fi
            # Real signature check against the pubkey, not just the key ID.
            sigfile=$(mktemp)
            printf '%s' "$sig" | base64 -d > "$sigfile"
            if ! minisign -V -p "$pubfile" -x "$sigfile" -m "${f%.sig}" > /dev/null; then
              echo "::error::$f does not verify against the pubkey"
              exit 1
            fi
          done

      - name: Write latest.json
        run: |
          set -euo pipefail
          base="https://github.com/KANOMNUT/garita/releases/download/$TAG"
          jq -n \
            --arg version "${TAG#v}" \
            --arg pub_date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg base "$base" \
            --rawfile notes meta/release-notes.md \
            --rawfile mac dist/Garita-macOS-arm64.app.tar.gz.sig \
            --rawfile deb dist/Garita-linux-amd64.deb.sig \
            --rawfile rpm dist/Garita-linux-amd64.rpm.sig \
            --rawfile msi dist/Garita-windows-amd64.msi.sig \
            --rawfile nsis dist/Garita-windows-amd64-setup.exe.sig '
            def sig: gsub("\\s"; "");
            { version: $version, notes: $notes, pub_date: $pub_date,
              platforms: {
                "darwin-aarch64":   { signature: ($mac | sig), url: "\($base)/Garita-macOS-arm64.app.tar.gz" },
                "linux-x86_64-deb": { signature: ($deb | sig), url: "\($base)/Garita-linux-amd64.deb" },
                "linux-x86_64-rpm": { signature: ($rpm | sig), url: "\($base)/Garita-linux-amd64.rpm" },
                "windows-x86_64-msi":  { signature: ($msi | sig),  url: "\($base)/Garita-windows-amd64.msi" },
                "windows-x86_64-nsis": { signature: ($nsis | sig), url: "\($base)/Garita-windows-amd64-setup.exe" } } }
          ' > dist/latest.json
          jq -e --arg base "$base/" '
            (.platforms | length) == 5
            and ([.platforms[].url | startswith($base)] | all)
            and ([.platforms[].signature | length > 0] | all)' dist/latest.json > /dev/null
          for url in $(jq -r '.platforms[].url' dist/latest.json); do
            test -f "dist/${url##*/}"
          done

      - name: Checksums
        working-directory: dist
        run: |
          cp ../meta/Garita-sbom.spdx.json .
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          # dmg, tarball, deb, rpm, msi, exe, 5 sigs, latest.json, sums, sbom
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 14

      # Signed SLSA build provenance, checkable with
      # `gh attestation verify <file> --repo <owner>/<repo>`. Free on public
      # repositories; private ones need GitHub Enterprise Cloud.
      - name: Attest build provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if draft=$(gh release view "$TAG" --json isDraft --jq .isDraft 2> /dev/null); then
            if [ "$draft" != "true" ]; then
              echo "::error::release $TAG is already published; its files are not replaced"
              exit 1
            fi
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --draft --verify-tag \
              --title "Garita $TAG" --notes-file meta/release-notes.md
          fi
