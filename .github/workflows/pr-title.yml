# Pull request titles follow Conventional Commits, because a squash merge
# turns the title into the commit message on main. A plain regex check: no
# action, no token. `synchronize` stays so the check can be made required
# (a required check must report on every head commit).
name: PR title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventional:
    name: Conventional title
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check the title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          re='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([^()]+\))?!?: [^[:space:]]'
          if [[ ! "$TITLE" =~ $re ]]; then
            echo "::error::The title must look like 'type: subject' or 'type(scope)!: subject', with type one of feat, fix, docs, style, refactor, perf, test, build, ci, chore, revert."
            exit 1
          fi
